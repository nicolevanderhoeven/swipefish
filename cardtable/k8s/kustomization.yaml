apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cardtable

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - ingress.yaml
  - cert-manager-issuer.yaml

images:
  - name: cardtable
    newName: noelbk/cardtable
    newTag: latest

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: deploy-vars
    envs:
      - deploy.env

replacements:
  - source:
      kind: ConfigMap
      name: deploy-vars
      fieldPath: data.DOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: cardtable-config
        fieldPaths:
          - data.PHX_HOST
      - select:
          kind: Ingress
          name: cardtable-ingress
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: deploy-vars
      fieldPath: data.EMAIL
    targets:
      - select:
          kind: ClusterIssuer
          name: letsencrypt-prod
        fieldPaths:
          - spec.acme.email
