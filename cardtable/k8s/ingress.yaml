apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardtable-ingress
  namespace: cardtable
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "cardtable"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "cardtable-sticky"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cardtable.swipe.fish
    secretName: cardtable-tls
  rules:
  - host: cardtable.swipe.fish
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cardtable
            port:
              number: 80
