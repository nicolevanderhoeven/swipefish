services:
  app:
    platform: linux/amd64
    image: cardtable:dev
    build:
      context: .
      target: dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
    environment:
      MIX_ENV: dev
    command: mix phx.server

volumes:
  mix_deps:
  mix_build:
